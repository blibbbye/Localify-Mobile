<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>Localify Mobile</title>
<style>
:root{--bg:#090b0e;--panel:#11161c;--panel2:#171d24;--line:#27303a;--text:#eef3f7;--muted:#8995a3;--accent:#7dd3fc;--danger:#ff7184;--nav:72px;--player:82px;--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{color:inherit}
.i{width:19px;height:19px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{border:0}
.app{min-height:100dvh}
.top{position:sticky;top:0;z-index:40;height:62px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:rgba(9,11,14,.95);backdrop-filter:blur(18px);border-bottom:1px solid #171c22}
.search{position:relative;min-width:0}.search .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#73808e;width:18px;height:18px}
.search input{width:100%;height:44px;padding:0 12px 0 38px;border-radius:14px;border:1px solid #2a333e;background:#11161c;color:#fff;outline:0}
.brand{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0;white-space:nowrap}
.brandText{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.brandText strong{font-size:13px;letter-spacing:-.45px}.brandText small{font-size:7px;letter-spacing:.12em;color:#74808e;margin-top:3px}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:cover}
main{padding:14px 10px calc(var(--player) + var(--nav) + 28px);max-width:980px;margin:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.headText{min-width:0}.head h1{margin:0;font-size:26px;letter-spacing:-.8px}.head p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.btn{min-height:42px;padding:9px 12px;border:1px solid #303a45;border-radius:12px;background:#151b21;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:850}
.btn.primary{background:var(--accent);color:#061017;border-color:transparent}.btn.danger{background:rgba(255,113,132,.08);border-color:rgba(255,113,132,.25);color:#ffb8c1}
.btn.icon{width:42px;padding:0}.btn.small{min-height:36px;padding:7px 10px;font-size:12px}
.hero{padding:18px;border:1px solid #27313b;border-radius:18px;background:linear-gradient(145deg,#171e25,#0f1419);margin-bottom:18px}
.heroKicker{font-size:9px;font-weight:950;letter-spacing:.12em;color:#72808d}.hero h2{margin:8px 0;font-size:37px;line-height:1.02;letter-spacing:-2px}.hero p{margin:0;color:#9aa5b1;font-size:12px;line-height:1.55}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1 1 145px}
.section{margin-top:20px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.sectionHead strong{font-size:17px}.sectionHead span{font-size:10px;color:#768391}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card{padding:8px;min-width:0;border:1px solid #202830;background:#11161b;border-radius:15px;overflow:hidden}.art{aspect-ratio:1;border-radius:11px;overflow:hidden;background:#202832;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:cover}.art .i{width:42px;height:42px;color:#64717f}.round .art{border-radius:50%}
.title{margin-top:8px;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:3px;font-size:10px;color:#7e8996;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{border:1px solid #202830;border-radius:15px;overflow:hidden;background:#0e1216}.row{min-height:62px;padding:7px 8px;border-bottom:1px solid #1b222a;display:grid;grid-template-columns:34px 42px minmax(0,1fr) 36px 36px;gap:7px;align-items:center}.row:last-child{border-bottom:0}.row.playing{background:rgba(125,211,252,.045)}.cover{width:42px;height:42px;border-radius:8px;overflow:hidden;background:#202832;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.rtext{min-width:0}.rtitle{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rsub{font-size:9px;color:#7e8996;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rtime{font-size:9px;color:#727d89;text-align:right}
.circle{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#151b21;border:1px solid #2b3540;color:#dce4eb;padding:0}.circle .i{margin:0;width:18px;height:18px}.circle.active{color:var(--accent);border-color:#385466;background:rgba(125,211,252,.1)}
.empty{padding:28px 14px;text-align:center;color:#778391;border:1px dashed #2a333d;border-radius:15px}.empty strong{display:block;color:#e1e7ec;font-size:14px;margin-bottom:5px}
.nav{position:fixed;left:0;right:0;bottom:var(--player);z-index:30;height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:rgba(10,13,17,.97);backdrop-filter:blur(20px);border-top:1px solid #222a33}.nav button{min-width:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#75818f;font-size:9px;font-weight:800}.nav button .i{width:19px;height:19px}.nav button.active{color:var(--accent);background:rgba(125,211,252,.08)}
.player{position:fixed;left:0;right:0;bottom:0;height:var(--player);z-index:35;background:rgba(8,11,14,.98);backdrop-filter:blur(22px);border-top:1px solid #2b333d;padding:7px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.now{min-width:0;display:flex;gap:8px;align-items:center}.nowArt{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none;background:#202832;display:grid;place-items:center}.nowArt img{width:100%;height:100%;object-fit:cover}.nowText{min-width:0}.nowTitle{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowArtist{font-size:9px;color:#7f8a96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerControls{display:flex;align-items:center;gap:3px}.playerControls .circle{width:34px;height:34px}.playerControls .big{width:42px;height:42px;background:#fff;color:#0b0e12;border-color:#fff}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px}.progress input{width:100%;height:3px;margin:0;display:block;appearance:none;background:rgba(255,255,255,.15);border-radius:0}.progress input::-webkit-slider-thumb{appearance:none;width:3px;height:3px;border:0;border-radius:0;background:var(--accent);box-shadow:-100vw 0 0 100vw var(--accent)}.progress input::-moz-range-thumb{width:3px;height:3px;border:0;background:var(--accent)}.progress input::-moz-range-progress{height:3px;background:var(--accent)}
.sheetShade{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:flex-end}.sheetShade.open{display:flex}.sheet{width:100%;max-height:88dvh;overflow:auto;background:#10151a;border-top:1px solid #2c3540;border-radius:22px 22px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -25px 70px rgba(0,0,0,.5)}.sheetGrab{width:42px;height:4px;background:#48525e;border-radius:99px;margin:0 auto 12px}.sheet h2{margin:4px 2px 12px;font-size:20px}.sheetGrid{display:grid;gap:7px}.sheetItem{min-height:46px;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#151b21;border:1px solid #27313b;border-radius:12px;text-align:left}.sheetItem .i{width:18px;height:18px}
.modalShade{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:flex-end}.modalShade.open{display:flex}.modal{width:100%;max-height:92dvh;overflow:auto;background:#11161c;border-top:1px solid #2f3944;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -30px 80px rgba(0,0,0,.6)}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.modalHead h2{margin:0;font-size:20px}.form{display:grid;gap:10px;margin-top:14px}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:900;color:#84909c;text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea,.field select{width:100%;border:1px solid #2b3540;background:#0c1116;color:#f2f5f7;border-radius:11px;padding:11px;outline:0}.field textarea{min-height:130px;resize:vertical}.modalFoot{display:flex;gap:7px;margin-top:14px}.modalFoot .btn{flex:1}.coverPick{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center}.coverPickPreview{width:82px;height:82px;border-radius:14px;overflow:hidden;background:#202832;display:grid;place-items:center}.coverPickPreview img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--player) + var(--nav) + 10px);z-index:150;padding:11px 13px;border-radius:12px;background:#171d23;border:1px solid #303a45;box-shadow:0 14px 45px rgba(0,0,0,.4);font-size:12px;font-weight:800;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translateY(0)}
.busyShade{position:fixed;inset:0;z-index:200;background:rgba(5,7,9,.82);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}.busyShade.open{display:flex}.busyCard{width:min(440px,100%);background:#12181e;border:1px solid #313c47;border-radius:20px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.55)}.busySpinner{width:38px;height:38px;border-radius:50%;border:3px solid #2f3944;border-top-color:var(--accent);margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.busyCard strong{display:block;font-size:17px}.busyCard span{display:block;margin-top:6px;color:#8b97a4;font-size:11px;line-height:1.45}
.detailHero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;padding:8px 0 15px}.detailArt{width:120px;height:120px;border-radius:18px;overflow:hidden;background:#202832;display:grid;place-items:center}.detailArt img{width:100%;height:100%;object-fit:cover}.detailTitle{font-size:25px;font-weight:950;line-height:1.02;letter-spacing:-1px;margin:0}.detailSub{margin-top:7px;color:#87929f;font-size:11px;line-height:1.45}
.pill{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid #29323c;background:#151b21;border-radius:99px;font-size:9px;color:#8b96a1;margin:4px 4px 0 0}
.morePanel{display:grid;gap:7px}.morePanel .btn{width:100%;justify-content:flex-start}
.notice{padding:10px 11px;border-radius:12px;background:rgba(125,211,252,.06);border:1px solid rgba(125,211,252,.16);color:#9eb7c6;font-size:10px;line-height:1.45}
.storageMeter{height:7px;border-radius:99px;background:#202932;overflow:hidden;margin-top:8px}.storageMeter div{height:100%;background:var(--accent);width:0}
@media (min-width:700px){main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{grid-template-columns:repeat(6,1fr)}.nav button{font-size:10px}.player{grid-template-columns:minmax(0,1fr) auto}.detailHero{grid-template-columns:180px minmax(0,1fr)}.detailArt{width:180px;height:180px}}
@media (max-width:430px){.detailHero{grid-template-columns:94px minmax(0,1fr)}.detailArt{width:94px;height:94px}.detailTitle{font-size:22px}.hero h2{font-size:33px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search your music"></div>
  <div class="brand"><div class="brandText"><strong>Localify Mobile</strong><small>LOCAL MUSIC</small></div><img src="./icon.svg" alt="Localify"></div>
</header>
<main id="main"></main>
<nav class="nav" id="nav"></nav>
<section class="player" id="player">
  <div class="now"><div class="nowArt" id="nowArt"></div><div class="nowText"><div class="nowTitle" id="nowTitle">Nothing playing</div><div class="nowArtist" id="nowArtist">Choose a song</div></div></div>
  <div class="playerControls"><button class="circle" id="prevBtn" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="m6 5 9 7-9 7z"/><path d="M19 5v14"/></svg></button><button class="circle big" id="playBtn" aria-label="Play"><svg class="i" id="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg></button><button class="circle" id="nextBtn" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M18 5 7 12l11 7z"/><path d="M5 5v14"/></svg></button></div>
  <div class="progress"><input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Track progress"></div>
</section>
<div class="sheetShade" id="sheetShade"><div class="sheet" id="sheet"></div></div>
<div class="modalShade" id="modalShade"><div class="modal" id="modal"></div></div>
<div class="busyShade" id="busyShade"><div class="busyCard"><div class="busySpinner"></div><strong id="busyTitle">Working…</strong><span id="busyText">Please keep Localify open while this finishes.</span></div></div>
<div class="toast" id="toast"></div>
<input id="audioPicker" type="file" hidden multiple accept="audio/*,.mp3,.m4a,.mp4,.aac,.flac,.wav,.ogg,.oga,.opus,.webm,.aiff,.aif,.alac,.caf">
<input id="imagePicker" type="file" hidden accept="image/*">
<input id="presetPicker" type="file" hidden accept="*/*">
<audio id="audio" preload="metadata" playsinline></audio>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NONE="None";
const DB_NAME="localify-mobile-v2",DB_VER=1;
const META_KEY="localify-mobile-v2-meta";
const BACKUP_KEY="localify-mobile-v2-backup";
const COVER_MAP_URL="https://raw.githubusercontent.com/blibbbye/Localify/main/covers.json";
const COVER_DIR="https://raw.githubusercontent.com/blibbbye/Localify/main/covers/";
const COVER_EXTS=[".jpg",".jpeg",".png",".webp",".gif",".avif"];
let db=null,rootDir=null,audioUrl="",currentBlob=null,saveTimer=0,toastTimer=0,busy=false;
let state={version:2,view:"home",search:"",tracks:[],albums:[],artists:[],playlists:[],liked:[],recent:[],queue:[],queueIndex:0,currentId:null,settings:{volume:.9,repeat:"off",shuffle:false},detail:null};
let coverMap=null,coverPromise=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():"m-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}
function icon(name){
 const p={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
 library:'<path d="M5 4v16"/><path d="M8 5h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8z"/><path d="M11 8h5M11 12h5M11 16h3"/>',
 albums:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2"/><path d="m6.5 17 4.2-4.2 2.7 2.7 2-2 2.1 2.1"/>',
 artists:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/>',
 playlists:'<path d="M5 6h14M5 12h14M5 18h10"/>',
 more:'<path d="M5 7h14M5 12h14M5 17h14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 play:'<path d="m8 5 11 7-11 7z"/>',
 pause:'<path d="M8 5v14M16 5v14"/>',
 next:'<path d="M18 5 7 12l11 7z"/><path d="M5 5v14"/>',
 prev:'<path d="m6 5 9 7-9 7z"/><path d="M19 5v14"/>',
 heart:'<path d="M20 8.8c0 5.3-8 10.2-8 10.2S4 14.1 4 8.8A4.1 4.1 0 0 1 12 7a4.1 4.1 0 0 1 8 1.8Z"/>',
 more2:'<circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
 queue:'<path d="M4 6h16M4 12h10M4 18h7"/><path d="m16 16 4 4m0-4-4 4"/>',
 edit:'<path d="m4 16.5-.7 3.2 3.2-.7L18 7.5 15.5 5z"/><path d="m13.5 7 3.5 3.5"/>',
 trash:'<path d="M5 7h14M9 7V4h6v3M8 10v7M12 10v7M16 10v7"/><path d="M6 7l1 13h10l1-13"/>',
 folder:'<path d="M3.5 7.5h6l2 2h9v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 7.5v-2h6l2 2"/>',
 download:'<path d="M12 4v11M7 11l5 5 5-5"/><path d="M5 20h14"/>',
 upload:'<path d="M12 20V9M7 13l5-5 5 5"/><path d="M5 4h14"/>',
 settings:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/>',
 shield:'<path d="M12 3 19 6v6c0 4.3-2.8 7.2-7 9-4.2-1.8-7-4.7-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
 close:'<path d="m6 6 12 12M18 6 6 18"/>',
 clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
 };
 return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(p[name]||p.more2)+'</svg>';
}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),3300)}
function busyShow(title,text){busy=true;$("#busyTitle").textContent=title;$("#busyText").textContent=text||"Please keep Localify open while this finishes.";$("#busyShade").classList.add("open")}
function busyUpdate(title,text){$("#busyTitle").textContent=title;$("#busyText").textContent=text}
function busyHide(){busy=false;$("#busyShade").classList.remove("open")}
function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta");if(!d.objectStoreNames.contains("files"))d.createObjectStore("files")};
  r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error||new Error("IndexedDB unavailable"));
 });
}
function idbGet(store,key){return new Promise((res,rej)=>{try{const r=db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbPut(store,key,value){return new Promise((res,rej)=>{try{const r=db.transaction(store,"readwrite").objectStore(store).put(value,key);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbDel(store,key){return new Promise((res,rej)=>{try{const r=db.transaction(store,"readwrite").objectStore(store).delete(key);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function cloneMeta(){return JSON.parse(JSON.stringify({...state,tracks:state.tracks.map(t=>{const x={...t};delete x.blob;delete x._blob;return x})}))}
async function persistRequest(){try{if(navigator.storage?.persist)await navigator.storage.persist()}catch{}}
async function initOPFS(){try{if(navigator.storage?.getDirectory)rootDir=await navigator.storage.getDirectory();}catch{rootDir=null}}
async function opfsFile(id,writeBlob){
 if(!rootDir)return null;
 const dir=await rootDir.getDirectoryHandle("localify-audio-v2",{create:true});
 const fh=await dir.getFileHandle(id,{create:true});
 if(writeBlob){const w=await fh.createWritable();await w.write(writeBlob);await w.close();return true}
 return await fh.getFile();
}
async function saveAudio(t,blob){
 t._blob=blob;
 if(rootDir){
  try{await opfsFile(t.id,blob);t.storage="opfs";delete t.blob;return}catch(e){console.warn("OPFS write failed",e)}
 }
 await idbPut("files",t.id,blob);t.storage="idb";
}
async function loadAudio(t){
 if(t._blob&&t._blob.size)return t._blob;
 try{
  if(t.storage==="opfs"&&rootDir){const f=await opfsFile(t.id,false);if(f?.size){t._blob=f;return f}}
 }catch(e){console.warn("OPFS read failed",e)}
 try{const b=await idbGet("files",t.id);if(b?.size){t._blob=b;return b}}catch{}
 return null;
}
async function removeAudio(t){
 t._blob=null;
 if(rootDir){try{const dir=await rootDir.getDirectoryHandle("localify-audio-v2",{create:true});await dir.removeEntry(t.id)}catch{}}
 try{await idbDel("files",t.id)}catch{}
}
async function saveMeta(writeBackup=true){
 const meta=cloneMeta();
 await idbPut("meta","app",meta);

async function addFiles(files){

 try{
  await persistRequest();let done=0;
  for(const file of files){
   if(!file.type.startsWith("audio/")&&!/\.(mp3|m4a|mp4|aac|flac|wav|ogg|oga|opus|webm|aiff|aif|alac|caf)$/i.test(file.name))continue;
   busyUpdate("Importing music",(done+1)+" / "+files.length+" • "+file.name);
   const t={id:uid(),title:file.name.replace(/\.[^.]+$/,""),artistIds:[],artist:NONE,albumId:null,album:NONE,albumArtist:NONE,fileName:file.name,addedAt:Date.now(),duration:0,blob:null,storage:"",cover:null,lyrics:"",explicit:false,genre:"",year:""};
   const url=URL.createObjectURL(file);const probe=new Audio();probe.preload="metadata";probe.src=url;
   await new Promise(resolve=>{let x=()=>{cleanup();resolve()};let cleanup=()=>{probe.removeEventListener("loadedmetadata",x);probe.removeEventListener("error",x)};probe.addEventListener("loadedmetadata",x);probe.addEventListener("error",x);setTimeout(x,5000)});
   t.duration=Number(probe.duration)||0;URL.revokeObjectURL(url);
   await saveAudio(t,file);state.tracks.push(t);done++;await saveMeta(true);
  }
  render();toast(done+" song"+(done===1?"":"s")+" added.");
 }catch(e){console.error(e);toast("Import stopped: "+(e?.message||"unknown error"))}finally{busyHide()}
}

async function importPreset(file){
 if(!file)return;

 try{
  const index=await readZipIndex(file);const mf=index.get("library.json");if(!mf)throw new Error("This preset is missing library.json.");

  if(!manifest.tracks.length&&!manifest.artists.length&&!manifest.albums.length&&!manifest.playlists.length)throw new Error("This preset does not contain supported Localify data.");
  const maps={artists:new Map(),albums:new Map(),tracks:new Map(),playlists:new Map()};
  manifest.artists.forEach(a=>{if(!a.id)a.id=uid();maps.artists.set(a.id,a);state.artists.push(a)});
  manifest.albums.forEach(a=>{if(!a.id)a.id=uid();maps.albums.set(a.id,a);state.albums.push(a)});
  let done=0;
  for(const src of manifest.tracks){
   done++;busyUpdate("Importing preset",done+" / "+manifest.tracks.length+" songs • "+(src.title||src.fileName||"song"));
   const t=JSON.parse(JSON.stringify(src));t.id=maps.tracks.has(src.id)?maps.tracks.get(src.id).id:(src.id||uid());
   const e=src.audioFile?index.get(src.audioFile):null;
   if(e){const blob=await zipEntryBlob(file,e);await saveAudio(t,blob)}else if(src.hasAudio)throw new Error("Missing audio for "+(src.title||"Unknown song"));
   delete t._blob;t._blob=null;state.tracks.push(t);
   if(done%5===0)await saveMeta(true);
  }
  manifest.playlists.forEach(p=>{if(!p.id)p.id=uid();state.playlists.push(p)});
  if(Array.isArray(manifest.liked))state.liked=[...new Set([...state.liked,...manifest.liked])];
  if(Array.isArray(manifest.recent))state.recent=[...new Set([...manifest.recent,...state.recent])].slice(0,100);
  await saveMeta(true);busyHide();render();toast("Preset imported successfully.");
 }catch(e){console.error(e);toast(e?.message||"Could not import preset.");}finally{busyHide()}
}

  if(a==="playAlbum"){playList(tracksForAlbum(id),0);return}
  if(a==="playArtist"){playList(tracksForArtist(id),0);return}
  if(a==="playPlaylist"){playList(tracksForPlaylist(state.playlists.find(p=>p.id===id)),0);return}
 });
 $("#sheetShade").addEventListener("click",e=>{if(e.target===$("#sheetShade"))closeSheet()});
 $("#modalShade").addEventListener("click",e=>{if(e.target===$("#modalShade"))closeModal()});
}
async function boot(){
 try{
  await openDB();await initOPFS();await persistRequest();await loadCoverMap();
  const had=await restore();
  if(!had){await saveMeta(true)}else await saveMeta(true);
  bindEvents();render();
  if(state.currentId&&state.tracks.some(t=>t.id===state.currentId))renderPlayer();
  toast(had?"Library restored.":"Localify Mobile ready.");
 }catch(e){
  console.error("boot",e);try{bindEvents();render()}catch{}toast("Localify opened, but browser storage is unavailable.");
 }
}
boot();
})();
</script>
