  try{
   if(!rootDir)await initOPFS();

  }catch{return false}

  await writeZipEntryToExternal(t.id,file,e);
  const f=await externalAudioFile(t.id).catch(()=>null);
  if(!f?.size||(expected&&f.size<expected))throw new Error("Saved external audio file is incomplete.");

   await writeZipEntryToOPFS(t.id,file,e);

   }catch{}
   try{await initOPFS()}catch{}
  }

 }
}

function findArtist(name){const k=String(name||"").trim().toLowerCase();return state.artists.find(a=>String(a.name||"").trim().toLowerCase()===k)||null}
function getArtistId(name){if(!name||/^unknown artist$/i.test(name)||/^none$/i.test(name))return null;return findArtist(name)?.id||null}
function artistNames(t){const ids=Array.isArray(t?.artistIds)?t.artistIds:[];const arr=ids.map(id=>state.artists.find(a=>a.id===id)?.name).filter(Boolean);return arr.length?arr:(t?.artist?String(t.artist).split(",").map(x=>x.trim()).filter(Boolean):[])}
function artistText(t){return artistNames(t).join(", ")||NONE}
function albumName(t){const a=state.albums.find(x=>x.id===t?.albumId);return a?.title||t?.album||NONE}
function trackTitle(t){return String(t?.title||t?.fileName||"Untitled").replace(/^0*(\d+)\s*[.)-:]\s*/,"")||"Untitled"}
function normalize(s){return String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function coverCandidates(name){
 const n=normalize(name);if(!n)return [];
 const a=[n,n.replace(/\s+/g,"_"),n.replace(/\s+/g,"-"),n.replace(/&/g,"and"),n.replace(/\biii\b/g,"3").replace(/\bii\b/g,"2").replace(/\bi\b/g,"1")];
 return [...new Set(a)];
}
async function loadCoverMap(){
 if(coverMap)return coverMap;
 if(coverPromise)return coverPromise;
 coverPromise=(async()=>{
  const out={};
  const controller=typeof AbortController==="function"?new AbortController():null;
  const timer=controller?setTimeout(()=>controller.abort(),3500):0;
  try{
   const r=await fetch(COVER_MAP_URL,{cache:"no-store",signal:controller?.signal||undefined,credentials:"omit"});
   if(r.ok){
    const d=await r.json();
    const raw=d&&typeof d.covers==="object"?d.covers:d;
    if(raw&&typeof raw==="object"&&!Array.isArray(raw))Object.assign(out,raw);
   }
  }catch(e){console.warn("covers.json unavailable",e)}
  if(timer)clearTimeout(timer);
  coverMap=out;
  return out;
 })();
 return coverPromise;
}
function coverUrlFromValue(v){if(!v)return "";try{if(/^https?:\/\//i.test(v))return v;return new URL(String(v).replace(/^\/+/,""),"https://raw.githubusercontent.com/blibbbye/Localify/main/").href}catch{return ""}}
async function findCover(t){
 const album=albumName(t),ref=album!==NONE?album:trackTitle(t);
 const map=await loadCoverMap();
 for(const c of coverCandidates(ref)){
  for(const [k,v] of Object.entries(map||{}))if(coverCandidates(k).includes(c))return coverUrlFromValue(v);
 }
 for(const c of coverCandidates(ref))for(const ext of COVER_EXTS){const u=COVER_DIR+encodeURIComponent(c)+ext;try{const r=await fetch(u,{method:"HEAD",cache:"force-cache"});if(r.ok)return u}catch{}}
 return "";
}
async function coverFor(t){
 const explicit=t?.cover||"";
 if(explicit)return explicit;
 return await findCover(t);
}
function art(t,cls){
 const fallback=icon(t?.albumId?"albums":"library");
 return '<div class="'+(cls||"art")+'" data-art="'+esc(t?.id||"")+'">'+fallback+'</div>';
}
function albumCover(a){
 return a?.cover||coverForStatic(a?.title||"");
}
function coverForStatic(title){
 const map=coverMap||{};
 for(const c of coverCandidates(title))for(const [k,v] of Object.entries(map))if(coverCandidates(k).includes(c))return coverUrlFromValue(v);
 return "";
}
function renderCoverInto(el,t){
 if(!el||!t)return;

}
function duration(s){s=Math.max(0,Number(s)||0);const m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+String(sec).padStart(2,"0")}
function totalDuration(ts){return ts.reduce((n,t)=>n+(Number(t.duration)||0),0)}
function totalLabel(ts){const mins=Math.floor(totalDuration(ts)/60);if(mins<60)return mins+" min";const h=Math.floor(mins/60),m=mins%60;return h+" hr"+(h===1?"":"s")+(m?" "+m+" min":"")}

function u32be(bytes,o){return (((bytes[o]||0)<<24)|((bytes[o+1]||0)<<16)|((bytes[o+2]||0)<<8)|(bytes[o+3]||0))>>>0}
function syncsafe(bytes,o){return (((bytes[o]||0)&127)<<21)|(((bytes[o+1]||0)&127)<<14)|(((bytes[o+2]||0)&127)<<7)|((bytes[o+3]||0)&127)}
function decodeTagText(body){if(!body?.length)return "";const enc=body[0],data=body.subarray(1);try{if(enc===3)return new TextDecoder("utf-8").decode(data).replace(/\0+$/,"").trim();if(enc===2){let s="";for(let i=0;i+1<data.length;i+=2)s+=String.fromCharCode((data[i]<<8)|data[i+1]);return s.replace(/\0+$/,"").trim()}if(enc===1){let p=0,little=true,s="";if(data.length>=2&&(data[0]===255||data[0]===254)){little=data[0]===254;p=2}for(;p+1<data.length;p+=2)s+=String.fromCharCode(little?(data[p]|data[p+1]<<8):((data[p]<<8)|data[p+1]));return s.replace(/\0+$/,"").trim()}return new TextDecoder("windows-1252").decode(data).replace(/\0+$/,"").trim()}catch{return ""}}
async function readEmbeddedAudioMetadata(file){
 if(!/\.mp3$/i.test(file?.name||""))return {};
 try{
  const size=Number(file?.size)||0;if(size<10)return {};
  const max=Math.min(size,4*1024*1024),bytes=new Uint8Array(await file.slice(0,max).arrayBuffer()),out={};
  if(bytes[0]===73&&bytes[1]===68&&bytes[2]===51){
   const ver=bytes[3]||3,end=Math.min(bytes.length,10+syncsafe(bytes,6));let p=10;
   while(p+10<=end){
    if(bytes[p]===0)break;
    const id=String.fromCharCode(bytes[p],bytes[p+1],bytes[p+2],bytes[p+3]),sz=ver>=4?syncsafe(bytes,p+4):u32be(bytes,p+4);
    if(!sz||p+10+sz>end)break;
    const body=bytes.subarray(p+10,p+10+sz);
    if(id[0]==="T"){
     if(id==="TXXX"){
      const raw=decodeTagText(body),parts=raw.split("\0"),desc=(parts.shift()||"").trim().toLowerCase(),value=parts.join("\0").trim();
      if(/editor|edit(?:ed|ing)?\s*by|software|encoded\s*by/.test(desc))out.editor=value;
     }else{
      const value=decodeTagText(body);
      if(id==="TIT2")out.title=value;
      else if(id==="TPE1")out.artist=value;
      else if(id==="TPE2")out.albumArtist=value;
      else if(id==="TALB")out.album=value;
      else if(id==="TDRC"||id==="TYER")out.year=(value.match(/\d{4}/)||[])[0]||value;
      else if(id==="TCON")out.genre=value.replace(/^\(\d+\)\s*/,"");
      else if(id==="TENC"||id==="TSSE")out.editor=value;
      else if(id==="TRCK")out.track=parseInt((value.match(/\d+/)||[])[0],10)||null;
      else if(id==="TPOS")out.disc=parseInt((value.match(/\d+/)||[])[0],10)||null;
     }
    }
    p+=10+sz;
   }
   return out;
  }
  if(size>=128){
   const tail=new Uint8Array(await file.slice(size-128).arrayBuffer());
   if(tail[0]===84&&tail[1]===65&&tail[2]===71){const td=new TextDecoder("windows-1252"),clean=x=>td.decode(x).replace(/\0+$/,"").trim();out.title=clean(tail.subarray(3,33));out.artist=clean(tail.subarray(33,63));out.album=clean(tail.subarray(63,93));out.year=clean(tail.subarray(93,97))}
  }
  return out;
 }catch{return {}}
}
function fileTrackNumber(name){const m=String(name||"").match(/^\s*0*(\d+)\s*[.)_-]/);return m?parseInt(m[1],10):null}
function sortTracks(list){return [...list].sort((a,b)=>(Number(a.fileTrack)||999999)-(Number(b.fileTrack)||999999)||(Number(a.disc)||1)-(Number(b.disc)||1)||(Number(a.track)||999999)-(Number(b.track)||999999)||String(trackTitle(a)).localeCompare(String(trackTitle(b)),undefined,{numeric:true,sensitivity:"base"}))}
async function addFiles(files,context={}){
 if(!files.length)return;
 await ensureStorageForAction();
 busyShow("Importing music","Preparing "+files.length+" file"+(files.length===1?"":"s")+"…");
 try{
  await persistRequest();
  let done=0;const added=[];
  for(const file of files){
   if(!file.type.startsWith("audio/")&&!/\.(mp3|m4a|mp4|aac|flac|wav|ogg|oga|opus|webm|aiff|aif|alac|caf)$/i.test(file.name))continue;
   busyUpdate("Importing music",(done+1)+" / "+files.length+" • "+file.name);
   const tags=await readEmbeddedAudioMetadata(file);
   const fileTrack=fileTrackNumber(file.name);
   const artistNames=String(tags.artist||"").split(/[,;]\s*/).map(x=>x.trim()).filter(Boolean);
   const artists=artistNames.map(n=>findArtist(n)||null).map((a,i)=>a||({id:uid(),name:artistNames[i],image:null,genres:[],bio:""}));
   artists.forEach(a=>{if(!state.artists.some(x=>x.id===a.id))state.artists.push(a)});
   const artistIds=artists.map(a=>a.id);
   const albumTitle=String(tags.album||"").trim();
   let album=null;
   if(albumTitle){
    album=state.albums.find(a=>String(a.title||"").trim().toLowerCase()===albumTitle.toLowerCase())||null;
    if(!album){album={id:uid(),title:albumTitle,artistIds:[...artistIds],artistNames:artistNames.join(", "),artist:artistNames.join(", "),cover:null,year:String(tags.year||""),genre:String(tags.genre||"")};state.albums.push(album)}
    else{
     if(artistIds.length&&!Array.isArray(album.artistIds))album.artistIds=[...artistIds];
     if(tags.year&&!album.year)album.year=String(tags.year);
     if(tags.genre&&!album.genre)album.genre=String(tags.genre);
     if(tags.albumArtist&&!album.albumArtist)album.albumArtist=String(tags.albumArtist);
    }
   }
   const t={
    id:uid(),
    title:String(tags.title||"").trim()||file.name.replace(/\.[^.]+$/,""),
    artist:artistNames.join(", ")||NONE,
    artistIds,
    albumId:album?.id||null,
    album:album?.title||String(tags.album||"").trim()||NONE,
    albumArtist:String(tags.albumArtist||"").trim()||artistNames.join(", ")||NONE,
    fileName:file.name,
    fileTrack,
    track:Number.isFinite(Number(tags.track))?Number(tags.track):null,
    disc:Number.isFinite(Number(tags.disc))?Number(tags.disc):null,
    metadataEditor:String(tags.editor||""),
    addedAt:Date.now(),duration:0,blob:null,storage:"",cover:album?.cover||null,lyrics:"",
    explicit:false,genre:String(tags.genre||"").trim(),year:String(tags.year||"").trim()
   };
   const url=URL.createObjectURL(file),probe=new Audio();probe.preload="metadata";probe.src=url;
   await new Promise(resolve=>{let x=()=>{cleanup();resolve()};let cleanup=()=>{probe.removeEventListener("loadedmetadata",x);probe.removeEventListener("error",x)};probe.addEventListener("loadedmetadata",x);probe.addEventListener("error",x);setTimeout(x,5000)});
   t.duration=Number(probe.duration)||0;URL.revokeObjectURL(url);
   await saveAudio(t,file);state.tracks.push(t);added.push(t);done++;
  }
  if(context.directoryImport&&added.length){
    const name=String(context.folderName||"Imported folder").trim()||"Imported folder";
    const f=createFolderEntity(name);
    f.trackIds=added.map(t=>t.id);
    f.albumIds=[...new Set(added.map(t=>t.albumId).filter(Boolean))];
    f.artistIds=[...new Set(added.flatMap(t=>t.artistIds||[]).filter(Boolean))];
  }
  state.tracks=sortTracks(state.tracks);
  await saveMeta(true);render();toast(context.directoryImport?done+" songs imported into "+(context.folderName||"folder")+".":done+" song"+(done===1?"":"s")+" added.");
 }catch(e){console.error(e);toast("Import stopped: "+(e?.message||"unknown error"))}finally{busyHide()}
}

 if(d?.type==="album")return sortTracks(tracksForAlbum(d.id));

  if(q)return state.tracks.filter(t=>(trackTitle(t)+" "+artistText(t)+" "+albumName(t)).toLowerCase().includes(q));

function ensurePlayerQueue(){
 if(!state.tracks.length)return false;
 state.queue=Array.isArray(state.queue)?state.queue.filter(id=>state.tracks.some(t=>t.id===id)):[];
 if(!state.queue.length){
  state.queue=state.tracks.map(t=>t.id);
 }
 if(state.currentId){
  const idx=state.queue.indexOf(state.currentId);
  if(idx>=0)state.queueIndex=idx;
  else{state.queue.splice(Math.max(0,state.queueIndex+1),0,state.currentId);state.queueIndex=state.queue.indexOf(state.currentId);}
 }
 if(!Number.isInteger(state.queueIndex)||state.queueIndex<0)state.queueIndex=0;

function zipCentral(name,crc,size,offset){const n=new TextEncoder().encode(name),ex=zipExtra([size,size,offset]),a=new Uint8Array(46+n.length+ex.length),d=new DataView(a.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,45,true);d.setUint16(6,45,true);d.setUint16(8,0x800,true);d.setUint32(16,crc>>>0,true);d.setUint32(20,0xffffffff,true);d.setUint32(24,0xffffffff,true);d.setUint16(28,n.length,true);d.setUint16(30,ex.length,true);d.setUint32(42,0xffffffff,true);a.set(n,46);a.set(ex,46+n.length);return a}
function zipEnd(count,cdSize,cdOff){const ex=zipExtra([count,cdSize,cdOff]),body=new Uint8Array(56+ex.length),d=new DataView(body.buffer);d.setUint32(0,0x06064b50,true);d.setBigUint64?.(4,BigInt(44+ex.length),true);d.setUint32(16,45,true);d.setUint32(20,45,true);d.setBigUint64?.(24,BigInt(count),true);d.setBigUint64?.(32,BigInt(count),true);d.setBigUint64?.(40,BigInt(cdSize),true);d.setBigUint64?.(48,BigInt(cdOff),true);d.setUint32(4,44,true);d.setUint32(16,45,true);d.setUint32(20,45,true);d.setUint16(0,0);return null}
function crc32Blob(blob){return blob.arrayBuffer().then(b=>{const a=new Uint8Array(b),tab=crcTable(),c0=0xffffffff;let c=c0;for(const x of a)c=tab[(c^x)&255]^(c>>>8);return (c^0xffffffff)>>>0})}

async function exportPreset(){
 await ensureStorageForAction();
 busyShow("Building preset","Collecting metadata…");
 try{
  busyCheck();
  const manifest={version:14,schema:"localify-preset-v2",presetKind:"full",presetName:"Full library",exportedAt:new Date().toISOString(),portableAudio:true,trackCount:state.tracks.length,audioTrackCount:0,artists:state.artists.map(x=>({...x})),albums:state.albums.map(x=>({...x})),tracks:[],playlists:state.playlists.map(x=>({...x})),folders:(state.folders||[]).map(x=>({...x})),liked:[...state.liked],recent:[...state.recent],settings:{...state.settings}};
  const files=[{name:"library.json",bytes:new TextEncoder().encode(JSON.stringify(manifest))}];
  let done=0;
  for(const src of state.tracks){busyCheck();done++;busyUpdate("Preparing preset",done+" / "+state.tracks.length+" songs");const b=await loadAudio(src);if(!b)throw new Error("Audio missing for "+trackTitle(src)+".");const t={...src};delete t._blob;t.storage="";t.hasAudio=true;t.audioFile="audio/"+src.id+(src.fileName?.match(/\.[^.]+$/)||[".bin"])[0];t.audioSize=b.size;manifest.tracks.push(t);manifest.audioTrackCount++;files.push({name:t.audioFile,bytes:new Uint8Array(await b.arrayBuffer())})}
  busyCheck();
  files[0].bytes=new TextEncoder().encode(JSON.stringify(manifest));
  let offset=0,parts=[],central=[];
  for(const f of files){busyCheck();busyUpdate("Creating preset",Math.min(files.indexOf(f)+1,files.length)+" / "+files.length+" entries");const crc=crc32(f.bytes),h=zipLocal(f.name,crc,f.bytes.length),o=offset;parts.push(h,f.bytes);central.push(zipCentral(f.name,crc,f.bytes.length,o));offset+=h.length+f.bytes.length}
  const cdOff=offset,cd=join(central);parts.push(cd);parts.push(eocdZip(central.length,cd.length,cdOff));
  const blob=new Blob(parts,{type:"application/octet-stream"});downloadBlob(blob,"Localify-Mobile.localify");busyHide();toast("Preset exported.");
 }catch(e){if(e?.name==="AbortError")toast("Preset export cancelled.");else{console.error(e);toast(e?.message||"Could not export preset.");}}finally{busyHide()}
}
function join(parts){const n=parts.reduce((s,x)=>s+x.length,0),out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function eocdZip(count,cdSize,cdOff){
 const loc=new Uint8Array(20),ld=new DataView(loc.buffer);ld.setUint32(0,0x07064b50,true);ld.setUint32(8,0,true);ld.setUint32(12,0xffffffff,true);ld.setUint32(16,1,true);
 const rec=new Uint8Array(56),d=new DataView(rec.buffer);d.setUint32(0,0x06064b50,true);d.setBigUint64(4,BigInt(44),true);d.setUint16(16,45,true);d.setUint16(18,45,true);d.setBigUint64(24,BigInt(count),true);d.setBigUint64(32,BigInt(count),true);d.setBigUint64(40,BigInt(cdSize),true);d.setBigUint64(48,BigInt(cdOff),true);
 const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(4,0xffff,true);e.setUint16(6,0xffff,true);e.setUint16(8,0xffff,true);e.setUint16(10,0xffff,true);e.setUint32(12,0xffffffff,true);e.setUint32(16,0xffffffff,true);e.setUint16(20,0,true);
 return new Uint8Array([...loc,...rec,...end]);
}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

let audioFxCtx=null,audioFxSource=null,audioFxBass=null,audioFxComp=null,audioFxMode="normal";
async function ensureAudioFx(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;
 try{
  if(!audioFxCtx){
   audioFxCtx=new AC();
   audioFxSource=audioFxCtx.createMediaElementSource(audio);
   audioFxBass=audioFxCtx.createBiquadFilter();
   audioFxBass.type="lowshelf";audioFxBass.frequency.value=140;
   audioFxComp=audioFxCtx.createDynamicsCompressor();
   audioFxSource.connect(audioFxBass);audioFxBass.connect(audioFxComp);audioFxComp.connect(audioFxCtx.destination);
  }
  if(audioFxCtx.state==="suspended")await audioFxCtx.resume();
  return true;
 }catch(e){console.warn("Audio effects unavailable",e);return false}
}
async function setAudioFx(mode){
 audioFxMode=mode||"normal";
 if(await ensureAudioFx()){
  if(audioFxMode==="bass")audioFxBass.gain.value=8;
  else if(audioFxMode==="night"){audioFxBass.gain.value=-4;audioFxComp.threshold.value=-30;audioFxComp.ratio.value=5}
  else{audioFxBass.gain.value=0;audioFxComp.threshold.value=-24;audioFxComp.ratio.value=2}
 }
}

  const files=[...e.target.files];e.target.value="";
  const root=(files[0]?.webkitRelativePath||"").split("/")[0]||"Imported folder";

 });
 $("#imagePicker").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(window.__editingProfilePicture){try{window.__pendingProfileAvatar=await fileToDataUrl(f);const el=$("#profilePreview");if(el)el.innerHTML='<img src="'+esc(window.__pendingProfileAvatar)+'" alt="">';window.__editingProfilePicture=false;}catch(err){window.__editingProfilePicture=false;toast("Could not read that profile picture.");}return}window.__pickedImage=f;toast("Image selected.");});

 if(!f)return;

});
 $("#profileBtn")?.addEventListener("click",openProfile);
 $("#playBtn").onclick=()=>{if(!state.currentId){if(state.tracks[0])playTrack(state.tracks[0].id);return}if(audio.paused)audio.play().catch(()=>{});else audio.pause();};
 $("#prevBtn").onclick=(e)=>{e.preventDefault();e.stopPropagation();prev()}; $("#playerMoreBtn")?.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();openPlayerControls()}); $("#nextBtn").onclick=(e)=>{e.preventDefault();e.stopPropagation();next()};const seekProgress=e=>{if(audio.duration){audio.currentTime=(+e.target.value/1000)*audio.duration;updateMediaSessionPosition();}};$("#progress").oninput=seekProgress;$("#progress").onchange=seekProgress;
 audio.addEventListener("play",()=>{try{if("mediaSession"in navigator)navigator.mediaSession.playbackState="playing"}catch{};renderPlayer();scheduleSave();pushDiscordPresence()});
 audio.addEventListener("pause",()=>{try{if("mediaSession"in navigator)navigator.mediaSession.playbackState="paused"}catch{};recordListeningProgress();renderPlayer();scheduleSave();pushDiscordPresence()});
 audio.addEventListener("timeupdate",()=>{recordListeningProgress();updatePlayerProgressOnly();updateMediaSessionPosition();});
 audio.addEventListener("loadedmetadata",()=>{updatePlayerProgressOnly();updateMediaSessionPosition()});
 audio.addEventListener("ended",()=>{recordListeningProgress();next();pushDiscordPresence()});

 document.addEventListener("click",async e=>{
  unlockMobileAudio();
  if(e.target.closest?.("#cancelBusyBtn")){cancelBusy();return}
  const viewBtn=e.target.closest?.("[data-view]");
  if(viewBtn){
    const view=viewBtn.dataset.view;
    if(view){state.view=view;state.detail=null;render();}
    return;
  }
  const playEl=e.target.closest?.(".playButton");
  if(playEl){
   const pid=playEl.dataset.id||playEl.closest("[data-id]")?.dataset.id;
   if(pid){e.preventDefault();e.stopPropagation();await playTrack(pid);return;}
  }
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  if(busy&&["addSongs","importPreset","exportPreset","deleteLibrary"].includes(a)){

    return;

  if(a==="closeModal"){closeModal();return}
  if(a==="editProfile"){closeSheet();editProfile();return}
  if(a==="changeProfilePicture"){window.__editingProfilePicture=true;openFilePicker($("#imagePicker"));return}
  if(a==="saveProfile"){saveProfile();return}
  if(a==="addSongs"){closeSheet();openFilePicker($("#audioPicker"));return}
  if(a==="importFolder"){closeSheet();openFilePicker($("#folderPicker"));return}
  if(a==="openFolders"){closeSheet();state.view="folders";render();return}
  if(a==="createFolder"){closeSheet();editFolder(null);return}
  if(a==="openFolder"){showFolder(id);return}
  if(a==="editFolder"){editFolder(id);return}
  if(a==="saveFolder"){saveFolder(id);return}
  if(a==="folderAdd"){openFolderAddMenu(id);return}
  if(a==="folderChoose"){closeModal();setTimeout(()=>openFolderPicker(id,b.dataset.kind),0);return}
  if(a==="folderBack"){closeModal();setTimeout(()=>openFolderAddMenu(id),0);return}
  if(a==="folderSaveItems"){
    const f=folderById(id),kind=b.dataset.kind;
    if(f){ensureFolderArrays(f);const key=folderKey(kind);const selected=[...document.querySelectorAll(".folderPick")].filter(x=>x.checked).map(x=>x.dataset.id);f[key]=selected;try{await ensureStorageForAction();await saveMeta(true);toast("Folder updated.");}catch(e){console.warn("folder save failed",e);toast("Could not save the folder yet.");}}
    closeModal();showFolder(id);return;
  }

  if(a==="setFx"){setAudioFx(b.dataset.fx);closeModal();return}
    if(a==="homeCreateMenu"){homeCreateMenu();return}

 });

}
async function boot(){
 busy=false;operationController=null;saveTimer=0;
 $("#busyShade").classList.remove("open");
 try{bindEvents();render()}catch(e){console.error("initial UI bind",e)}
 busyShow("Loading save","Loading your Localify library…");busyUpdate("Loading save","Preparing device storage…",8);
 storageInitPromise=(async()=>{
  try{
   try{await Promise.race([openDB(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("IndexedDB startup timed out.")),8000))])}catch(e){console.warn("IndexedDB unavailable; continuing with other storage",e);db=null}
   try{await Promise.race([initOPFS(),new Promise(resolve=>setTimeout(resolve,5000))])}catch(e){console.warn("OPFS unavailable",e);rootDir=null}
   try{await loadExternalStorageHandle()}catch{}
   await persistRequest();
   busyUpdate("Loading save","Restoring your library…",55);
   const had=await restore();
   normalizeStats();normalizeProfile();
   if(!had)try{await saveMeta(true)}catch(e){console.warn("initial metadata save failed",e)}
   busyUpdate("Loading save","Finishing library setup…",88);
   storageReady=storageBackendAvailable();
   void loadCoverMap().then(()=>bindCovers()).catch(()=>{});
   if(state.currentId&&state.tracks.some(t=>t.id===state.currentId))renderPlayer();
   busyUpdate("Loading save",storageReady?"Ready.":"Storage needs permission in this browser.",100);
   return had;
  }catch(e){
   console.error("storage boot",e);
   storageReady=storageBackendAvailable();
   return false;
  }
 })();
 try{
  const had=await storageInitPromise;
  if(had)toast("Library restored.");
  else if(storageReady)toast("Localify Mobile ready.");
  else toast("Localify is running. Browser storage permission is required to save or import audio.");
  busyHide();
 }catch(e){console.error("boot storage",e);busyHide()}
}
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js?v=20261004-storagefix7",{updateViaCache:"none"}).then(r=>r.update()).catch(e=>console.warn("service worker update failed",e));
}
boot().then(()=>{setTimeout(()=>{try{window.LocalifyNative?.connectDiscord?.()}catch{};pushDiscordPresence()},400)});
})();
