<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Localify Share</title>
<meta name="description" content="A Localify library preview.">
<meta property="og:type" content="website">
<meta property="og:title" content="Localify Library">
<meta property="og:description" content="A shared Localify library preview.">
<meta property="og:image" content="https://raw.githubusercontent.com/blibbbye/Localify/main/Localify%20Logo.png">
<meta name="theme-color" content="#7dd3fc">
<style>
:root{color-scheme:dark;--bg:#07090c;--panel:#0d1116;--panel2:#11171d;--panel3:#151c23;--line:#252d36;--text:#f5f7fa;--muted:#87929f;--accent:#7dd3fc;--glow:rgba(125,211,252,.10)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 50% -15%,var(--glow),transparent 65%),linear-gradient(#090b0f,#06080b 70%);font:14px Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
button,input{font:inherit}.wrap{max-width:1080px;margin:auto;padding:22px 16px 56px}.top{display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:-.4px}.logo{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--accent);box-shadow:0 8px 28px var(--glow)}.logo img{width:100%;height:100%;object-fit:cover}.shareChip{margin-left:auto;color:#aab4bf;border:1px solid var(--line);background:rgba(13,17,22,.9);padding:8px 10px;border-radius:999px;font-size:11px;font-weight:800}
.hero{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#12181e,#0b1015);box-shadow:0 24px 80px rgba(0,0,0,.35)}.heroGrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}.coverWall{width:160px;height:160px;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:#151b21;box-shadow:0 18px 45px rgba(0,0,0,.35)}.coverWall img,.miniArt img{width:100%;height:100%;object-fit:cover}.coverCell{min-width:0;min-height:0;background:linear-gradient(145deg,#1a222b,#0d1217);display:grid;place-items:center;color:#607080;font-size:32px}.heroTitle{font-size:clamp(30px,5vw,52px);line-height:.98;letter-spacing:-2px;margin:0}.heroSub{color:var(--muted);margin-top:8px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:16px}.stat{min-width:0}.stat{padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(17,23,29,.92)}.stat b{display:block;font-size:23px}.stat span{color:#7f8a96;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 3px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#07090c 70%,transparent)}.tab{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0e1318;color:#9ca7b2;font-weight:850;font-size:11px}.tab.active{background:var(--accent);border-color:var(--accent);color:#081017}
.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.search{flex:1;min-width:0;background:#0f1419;border:1px solid var(--line);border-radius:12px;color:#fff;padding:10px 12px;outline:none}.search:focus{border-color:#46515e}.count{color:#76818c;font-size:11px}
 .panel{border:1px solid var(--line);border-radius:17px;background:rgba(13,18,23,.94);overflow:hidden}.list{max-height:620px;overflow:auto}.shareGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px}.shareCard{min-width:0;border:1px solid #202830;background:#11161b;border-radius:15px;padding:9px;overflow:hidden}.shareCardTitle{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.shareArt{aspect-ratio:1;border-radius:11px;overflow:hidden;background:#202832;display:grid;place-items:center;color:#64717f}.shareArt img{width:100%;height:100%;object-fit:cover;display:block}.shareCard.artist .shareArt{border-radius:50%}.shareFolderArt{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1;border-radius:11px;overflow:hidden;background:#1a222a;gap:2px}.shareFolderArt>div{min-width:0;min-height:0;background:#202a33;display:grid;place-items:center;color:#64717f;overflow:hidden}.shareFolderArt img{width:100%;height:100%;object-fit:cover;display:block}.sharePlaceholder{font-size:28px}.empty{padding:22px;color:#7f8a96;text-align:center;grid-column:1/-1}.footer{margin-top:16px;color:#687480;font-size:10px;line-height:1.5}
@media(max-width:900px){.shareGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.heroGrid{grid-template-columns:1fr}.coverWall{width:112px;height:112px}.stats{grid-template-columns:repeat(5,minmax(118px,1fr));overflow-x:auto;padding-bottom:2px}.wrap{padding-left:11px;padding-right:11px}.shareGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.shareCard{padding:8px}.shareCardTitle{font-size:11px;margin-bottom:7px}}</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand"><div class="logo"><img src="https://raw.githubusercontent.com/blibbbye/Localify/main/Localify%20Logo.png" alt=""></div><span>LOCALIFY</span></div><div class="shareChip">Shared library</div></div>
 <section class="hero">
  <div class="heroGrid"><div class="coverWall" id="coverWall"><div class="coverCell">♫</div><div class="coverCell">♫</div><div class="coverCell">♫</div><div class="coverCell">♫</div></div><div><h1 class="heroTitle" id="title">Localify Library</h1><div class="heroSub" id="subtitle">Loading preview…</div><div class="stats" id="stats"></div></div></div>
 </section>
 <div class="tabs" id="tabs"></div>
 <div class="toolbar"><input id="search" class="search" placeholder="Search this preview…"><span id="count" class="count"></span></div>
 <div class="panel"><div id="list" class="list"></div></div>
 <div class="footer">This is a lightweight preview link. Audio files are not included in the link.</div>
</div>
<script>
(async()=>{
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
 const b64u=s=>s.replace(/-/g,"+").replace(/_/g,"/");
 async function gunzip(bytes){if(!("DecompressionStream"in window))return null;const ds=new DecompressionStream("gzip"),stream=new Blob([bytes]).stream().pipeThrough(ds),buf=await new Response(stream).arrayBuffer();return new Uint8Array(buf)}
 async function decode(){
   const raw=location.hash.slice(1);if(!raw)return null;
   try{
     const pad="=".repeat((4-raw.length%4)%4),bin=atob(b64u(raw)+pad);
     const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
     if(bytes[0]===31&&bytes[1]===139){const out=await gunzip(bytes);if(!out)return null;return JSON.parse(new TextDecoder().decode(out))}
     return JSON.parse(new TextDecoder().decode(bytes));
   }catch{return null}
 }
 const d=await decode();
 if(!d){$("#subtitle").textContent="This share link is missing or invalid.";$("#list").innerHTML='<div class="empty">Create a new share preview from Localify.</div>';return}
 const alpha=(arr,getter)=>arr.slice().sort((a,b)=>String(getter(a)||"").localeCompare(String(getter(b)||""),undefined,{numeric:true,sensitivity:"base"}));
 const cats={
  overview:{label:"Overview",items:[]},
  albums:{label:"Albums",items:alpha(d.a||d.albums||[],x=>x.t??x.title)},
  artists:{label:"Artists",items:alpha(d.r||d.artists||[],x=>x.n??x.name)},
  songs:{label:"Songs",items:alpha(d.s||d.songs||[],x=>x.t??x.title)},
  folders:{label:"Folders",items:alpha(d.f||d.folders||[],x=>x.n??x.name)},
  playlists:{label:"Playlists",items:alpha(d.p||d.playlists||[],x=>x.n??x.name)}
 };
 const counts=d.c||d.counts||{};
 $("#title").textContent=d.n||d.name||"Localify Library";
 $("#subtitle").textContent=(d.x||d.exportedAt||d.createdAt?"Shared Localify library":"Localify library preview")+" • "+Number(counts.songs??d.totalTracks??0).toLocaleString()+" songs";
 const stats=[["Albums",counts.albums],["Artists",counts.artists],["Folders",counts.folders],["Playlists",counts.playlists],["Songs",counts.songs??d.totalTracks]];
 $("#stats").innerHTML=stats.map(x=>'<div class="stat"><b>'+Number(x[1]||0).toLocaleString()+'</b><span>'+x[0]+'</span></div>').join("");
 const albumCovers=cats.albums.items.map(x=>x.k||x.cover||"").filter(Boolean);
 $("#coverWall").innerHTML=albumCovers.slice(0,4).map(u=>'<div class="coverCell"><img src="'+esc(u)+'" alt=""></div>').join("");
 while($("#coverWall").children.length<4)$("#coverWall").insertAdjacentHTML("beforeend",'<div class="coverCell">♫</div>');
 let current="overview",query="";
 function renderTabs(){$("#tabs").innerHTML=Object.entries(cats).map(([id,x])=>'<button class="tab '+(id===current?"active":"")+'" data-tab="'+id+'">'+x.label+'</button>').join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.tab;query="";$("#search").value="";render()})}
 function folderHtml(x){
   const covers=Array.isArray(x.k)?x.k.slice(0,4):[];
   return '<div class="shareFolderArt">'+[0,1,2,3].map(i=>covers[i]?'<div><img src="'+esc(covers[i])+'" alt=""></div>':'<div><span class="sharePlaceholder">▣</span></div>').join("")+'</div>';
 }
 function cardHtml(type,x){
   const title=type==="albums"?x.t??x.title||"Untitled album":type==="artists"?x.n??x.name||"Unknown Artist":type==="songs"?x.t??x.title||"Untitled song":type==="folders"?x.n??x.name||"Untitled folder":x.n??x.name||"Untitled playlist";
   const cover=type==="artists"?x.k||x.cover||x.image||"":x.k||x.cover||"";
   const artHtml=type==="folders"?folderHtml(x):'<div class="shareArt">'+(cover?'<img src="'+esc(cover)+'" alt="">':'<span class="sharePlaceholder">'+(type==="artists"?"♟":type==="playlists"?"☷":type==="songs"?"♫":"▣")+'</span>')+'</div>';
   return '<div class="shareCard '+(type==="artists"?"artist":"")+'"><div class="shareCardTitle">'+esc(title)+'</div>'+artHtml+'</div>';
 }
 function dataFor(id){return id==="overview"?[]:cats[id].items}
 function render(){
   renderTabs();
   const q=query.trim().toLocaleLowerCase();
   const filtered=dataFor(current).filter(x=>{if(!q)return true;const title=String(x.t??x.n??x.title??x.name??"");return title.toLocaleLowerCase().includes(q)});
   $("#count").textContent=filtered.length.toLocaleString()+" shown";
   if(current==="overview"){
     $("#list").innerHTML='<div class="shareGrid"><div class="shareCard"><div class="shareCardTitle">Albums</div><div class="shareArt">'+(cats.albums.items[0]?.k?'<img src="'+esc(cats.albums.items[0].k)+'" alt="">':'<span class="sharePlaceholder">▣</span>')+'</div></div><div class="shareCard artist"><div class="shareCardTitle">Artists</div><div class="shareArt">'+(cats.artists.items[0]?.k?'<img src="'+esc(cats.artists.items[0].k)+'" alt="">':'<span class="sharePlaceholder">♟</span>')+'</div></div><div class="shareCard"><div class="shareCardTitle">Songs</div><div class="shareArt">'+(cats.songs.items[0]?.k?'<img src="'+esc(cats.songs.items[0].k)+'" alt="">':'<span class="sharePlaceholder">♫</span>')+'</div></div><div class="shareCard"><div class="shareCardTitle">Folders</div>'+folderHtml(cats.folders.items[0]||{})+'</div><div class="shareCard"><div class="shareCardTitle">Playlists</div><div class="shareArt">'+(cats.playlists.items[0]?.k?'<img src="'+esc(cats.playlists.items[0].k)+'" alt="">':'<span class="sharePlaceholder">☷</span>')+'</div></div></div>';
   }else{
     $("#list").innerHTML=filtered.length?'<div class="shareGrid">'+filtered.map(x=>cardHtml(current,x)).join("")+'</div>':'<div class="shareGrid"><div class="empty">Nothing in this category matches your search.</div></div>';
   }
 }
 $("#search").oninput=e=>{query=e.target.value;render()};
 render();
 document.title=(d.n||d.name||"Localify Library")+" — Localify";
 const ogT=document.querySelector('meta[property="og:title"]'),ogD=document.querySelector('meta[property="og:description"]');
 if(ogT)ogT.content=d.n||d.name||"Localify Library";
 if(ogD)ogD.content=Number(counts.albums||0).toLocaleString()+" albums • "+Number(counts.songs??d.totalTracks??0).toLocaleString()+" songs • "+Number(counts.artists||0).toLocaleString()+" artists";
})();
</script>
</body>
</html>
