<style>

.sheetShade{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:flex-end}.sheetShade.open{display:flex}.sheet{width:100%;max-height:88dvh;overflow:auto;background:#10151a;border-top:1px solid #2c3540;border-radius:22px 22px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -25px 70px rgba(0,0,0,.5)}.sheetGrab{width:42px;height:4px;background:#48525e;border-radius:99px;margin:0 auto 12px}.sheet h2{margin:4px 2px 12px;font-size:20px}.sheetGrid{display:grid;gap:7px}.sheetItem{min-height:46px;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#151b21;border:1px solid #27313b;border-radius:12px;text-align:left}.sheetItem .i{width:18px;height:18px}
.modalShade{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:flex-end}.modalShade.open{display:flex}.modal{width:100%;max-height:92dvh;overflow:auto;background:#11161c;border-top:1px solid #2f3944;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -30px 80px rgba(0,0,0,.6)}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.modalHead h2{margin:0;font-size:20px}.form{display:grid;gap:10px;margin-top:14px}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:900;color:#84909c;text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea,.field select{width:100%;border:1px solid #2b3540;background:#0c1116;color:#f2f5f7;border-radius:11px;padding:11px;outline:0}.field textarea{min-height:130px;resize:vertical}.modalFoot{display:flex;gap:7px;margin-top:14px}.modalFoot .btn{flex:1}.coverPick{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center}.coverPickPreview{width:82px;height:82px;border-radius:14px;overflow:hidden;background:#202832;display:grid;place-items:center}.coverPickPreview img{width:100%;height:100%;object-fit:cover}

.btn.icon .i,.circle .i,.sheetItem .i{margin:0;flex:none}
.brandText{align-items:flex-end}

 .top{grid-template-columns:minmax(0,1fr) auto}
 .brand{gap:6px}.brand img{width:32px;height:32px}

<body>
<div class="app">
<header class="top">
  <div class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search your music"></div>
  <div class="topRight"><button class="profileBtn" id="profileBtn" type="button" aria-label="Localify profile"><span class="profileIcon">'+icon("user")+'</span><span class="profileBtnText" id="profileBtnText">Log in</span></button><div class="brand"><div class="brandText"><strong>Localify Mobile</strong></div><img src="./icon.svg" alt="Localify"></div></div>
</header>
<main id="main"></main>
<nav class="nav" id="nav"></nav>
<section class="player" id="player">
  <div class="now"><div class="nowArt" id="nowArt"></div><div class="nowText"><div class="nowTitle" id="nowTitle">Nothing playing</div><div class="nowArtist" id="nowArtist">Choose a song</div></div></div>
  <div class="playerControls"><button class="circle" id="prevBtn" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="m6 5 9 7-9 7z"/><path d="M19 5v14"/></svg></button><button class="circle big" id="playBtn" aria-label="Play"><svg class="i" id="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg></button><button class="circle" id="nextBtn" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M18 5 7 12l11 7z"/><path d="M5 5v14"/></svg></button></div>
  <div class="progress"><input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Track progress"></div>
</section>
<div class="sheetShade" id="sheetShade"><div class="sheet" id="sheet"></div></div>
<div class="modalShade" id="modalShade"><div class="modal" id="modal"></div></div>
<div class="busyShade" id="busyShade"><div class="busyCard"><div class="busySpinner"></div><strong id="busyTitle">Working…</strong><span id="busyText">Please keep Localify open while this finishes.</span><button class="btn" id="cancelBusyBtn" type="button">Cancel</button></div></div>
<div class="toast" id="toast"></div>
<input id="audioPicker" type="file" hidden multiple accept="audio/*,.mp3,.m4a,.mp4,.aac,.flac,.wav,.ogg,.oga,.opus,.webm,.aiff,.aif,.alac,.caf">
<input id="folderPicker" type="file" hidden webkitdirectory directory multiple accept="audio/*,.mp3,.m4a,.mp4,.aac,.flac,.wav,.ogg,.oga,.opus,.webm,.aiff,.aif,.alac,.caf">
<input id="imagePicker" type="file" hidden accept="image/*">
<input id="presetPicker" type="file" hidden accept="*/*">
<audio id="audio" preload="metadata" playsinline></audio>
</div>
<script>
(function(){

  const timer=controller?setTimeout(()=>controller.abort(),3500):0;

   const r=await fetch(COVER_MAP_URL,{cache:"no-store",signal:controller?.signal||undefined,credentials:"omit"});
   if(r.ok){
    const d=await r.json();
    const raw=d&&typeof d.covers==="object"?d.covers:d;
    if(raw&&typeof raw==="object"&&!Array.isArray(raw))Object.assign(out,raw);

  for(const f of files){busyCheck();busyUpdate("Creating preset",Math.min(files.indexOf(f)+1,files.length)+" / "+files.length+" entries");const crc=crc32(f.bytes),h=zipLocal(f.name,crc,f.bytes.length),o=offset;parts.push(h,f.bytes);central.push(zipCentral(f.name,crc,f.bytes.length,o));offset+=h.length+f.bytes.length}
  const cdOff=offset,cd=join(central);parts.push(cd);parts.push(eocdZip(central.length,cd.length,cdOff));
  const blob=new Blob(parts,{type:"application/octet-stream"});downloadBlob(blob,"Localify-Mobile.localify");busyHide();toast("Preset exported.");
 }catch(e){if(e?.name==="AbortError")toast("Preset export cancelled.");else{console.error(e);toast(e?.message||"Could not export preset.");}}finally{busyHide()}
}
function join(parts){const n=parts.reduce((s,x)=>s+x.length,0),out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function eocdZip(count,cdSize,cdOff){
 const loc=new Uint8Array(20),ld=new DataView(loc.buffer);ld.setUint32(0,0x07064b50,true);ld.setUint32(8,0,true);ld.setUint32(12,0xffffffff,true);ld.setUint32(16,1,true);
 const rec=new Uint8Array(56),d=new DataView(rec.buffer);d.setUint32(0,0x06064b50,true);d.setBigUint64(4,BigInt(44),true);d.setUint16(16,45,true);d.setUint16(18,45,true);d.setBigUint64(24,BigInt(count),true);d.setBigUint64(32,BigInt(count),true);d.setBigUint64(40,BigInt(cdSize),true);d.setBigUint64(48,BigInt(cdOff),true);
 const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(4,0xffff,true);e.setUint16(6,0xffff,true);e.setUint16(8,0xffff,true);e.setUint16(10,0xffff,true);e.setUint32(12,0xffffffff,true);e.setUint32(16,0xffffffff,true);e.setUint16(20,0,true);
 return new Uint8Array([...loc,...rec,...end]);
}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function backupMeta(){const blob=new Blob([JSON.stringify(cloneMeta(),null,2)],{type:"application/json"});downloadBlob(blob,"Localify-Mobile-metadata-backup.json");toast("Metadata backup exported.")}
function deleteLibrary(){
 openModal('<div class="modalHead"><h2>Delete library?</h2><button class="circle" data-action="closeModal">'+icon("close")+'</button></div><div class="notice">This removes Localify Mobile’s saved songs, albums, artists and playlists from this browser.</div><div class="modalFoot"><button class="btn" data-action="closeModal">Cancel</button><button class="btn danger" data-action="confirmDelete">Delete everything</button></div>');
}
async function confirmDelete(){
 const oldTracks=[...state.tracks];state={version:2,view:"home",search:"",tracks:[],albums:[],artists:[],playlists:[],liked:[],recent:[],queue:[],queueIndex:0,currentId:null,settings:{volume:.9,repeat:"off",shuffle:false},detail:null};
 for(const t of oldTracks)await removeAudio(t);await saveMeta(true);audio.pause();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl="";closeModal();render();toast("Library deleted.");
}
async function downloadSong(id){
 const t=state.tracks.find(x=>x.id===id);if(!t)return;const b=await loadAudio(t);if(!b){toast("This song's audio is missing.");return}downloadBlob(b,(artistText(t)!==NONE?artistText(t)+" - ":"")+trackTitle(t)+(t.fileName?.match(/\.[^.]+$/)?.[0]||".mp3"));toast("Song downloaded.");
}
function bindEvents(){
 $("#search").addEventListener("input",e=>{state.search=e.target.value;state.view=e.target.value.trim()?"search":state.view==="search"?"home":state.view;render()});
 $("#audioPicker").addEventListener("change",e=>{const files=[...e.target.files];e.target.value="";addFiles(files)});
 $("#imagePicker").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f){window.__pickedImage=f;toast("Image selected.");}});
 $("#presetPicker").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importPreset(f)});
 $("#profileBtn")?.addEventListener("click",openProfile);
 $("#playBtn").onclick=()=>{if(!state.currentId){if(state.tracks[0])playTrack(state.tracks[0].id);return}if(audio.paused)audio.play().catch(()=>{});else audio.pause();};
 $("#prevBtn").onclick=prev;$("#nextBtn").onclick=next;$("#progress").oninput=e=>{if(audio.duration)audio.currentTime=(+e.target.value/1000)*audio.duration};
 audio.addEventListener("play",()=>{renderPlayer();scheduleSave()});
 audio.addEventListener("pause",()=>{recordListeningProgress();renderPlayer();scheduleSave()});
 audio.addEventListener("timeupdate",()=>{recordListeningProgress();renderPlayer()});
 audio.addEventListener("ended",()=>{recordListeningProgress();next()});

 document.addEventListener("click",async e=>{
  if(e.target.closest?.("#cancelBusyBtn")){cancelBusy();return}
  const viewBtn=e.target.closest?.("[data-view]");
  if(viewBtn){
    const view=viewBtn.dataset.view;
    if(view){state.view=view;state.detail=null;render();}
    return;
  }
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  if(busy&&["addSongs","importPreset","exportPreset","deleteLibrary"].includes(a)){
    toast("Localify is busy. Please wait for the current operation to finish.");
    return;
  }
  if(a==="closeModal"){closeModal();return}
  if(a==="profileLogin"){
   const name=$("#profileNameInput")?.value.trim()||"Localify User";
   state.profile={loggedIn:true,name:name.slice(0,40)};
   normalizeProfile();saveMeta(true).catch(()=>{});renderProfileButton();closeModal();openProfile();return;
  }
  if(a==="profileLogout"){
   state.profile={loggedIn:false,name:""};saveMeta(true).catch(()=>{});renderProfileButton();closeModal();return;
  }
  if(a==="addSongs"){closeSheet();openFilePicker($("#audioPicker"));return}
  if(a==="openLibraryTools"){openLibraryTools();return}
  if(a==="importPreset"){closeSheet();openFilePicker($("#presetPicker"));return}
  if(a==="exportPreset"){closeSheet();exportPreset();return}
  if(a==="backupMeta"){closeSheet();backupMeta();return}
  if(a==="storageInfo"){closeSheet();storageInfo();return}
  if(a==="persistNow"){persistNow();return}
  if(a==="deleteLibrary"){closeSheet();deleteLibrary();return}
  if(a==="confirmDelete"){await confirmDelete();return}
  if(a==="songMenu"){openSongMenu(id);return}
  if(a==="playSong"){closeSheet();await playTrack(id);return}
  if(a==="queueSong"){closeSheet();state.queue.push(id);state.queue=[...new Set(state.queue)];scheduleSave();toast("Added to queue.");return}
  if(a==="toggleLike"){closeSheet();if(state.liked.includes(id))state.liked=state.liked.filter(x=>x!==id);else state.liked.push(id);scheduleSave();render();return}
  if(a==="editSong"){closeSheet();const t=state.tracks.find(x=>x.id===id);if(t)createEditor("song",t);return}
  if(a==="downloadSong"){closeSheet();await downloadSong(id);return}
  if(a==="createAlbum"){createEditor("album",null);return}
  if(a==="createArtist"){createEditor("artist",null);return}
  if(a==="createPlaylist"){createEditor("playlist",null);return}
  if(a==="editAlbum"){const x=state.albums.find(v=>v.id===id);if(x)createEditor("album",x);return}
  if(a==="editArtist"){const x=state.artists.find(v=>v.id===id);if(x)createEditor("artist",x);return}
  if(a==="editPlaylist"){const x=state.playlists.find(v=>v.id===id);if(x)createEditor("playlist",x);return}
  if(a==="saveEditor"){saveEditor(b.dataset.kind,id);return}
  if(a==="openAlbum"){showDetail("album",id);return}
  if(a==="openArtist"){showDetail("artist",id);return}
  if(a==="openPlaylist"){showDetail("playlist",id);return}
  if(a==="playAlbum"){playList(tracksForAlbum(id),0);return}
  if(a==="playArtist"){playList(tracksForArtist(id),0);return}
  if(a==="playPlaylist"){playList(tracksForPlaylist(state.playlists.find(p=>p.id===id)),0);return}
 });
 $("#sheetShade").addEventListener("click",e=>{if(e.target===$("#sheetShade"))closeSheet()});
 $("#modalShade").addEventListener("click",e=>{if(e.target===$("#modalShade"))closeModal()});
}
async function boot(){
  // Reset transient UI-operation state on every page load so an interrupted
  // import/export can never leave the whole page looking disabled.
  busy=false;operationController=null;saveTimer=0;
  $("#busyShade").classList.remove("open");
  if(operationController?.abort)try{operationController.abort()}catch{}
  try{bindEvents();render()}catch(e){console.error("initial UI bind",e)}
  storageInitPromise=(async()=>{
   try{
    await Promise.race([openDB(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("IndexedDB startup timed out.")),8000))]);
    await Promise.race([initOPFS(),new Promise(resolve=>setTimeout(resolve,5000))]);
    await persistRequest();

  const had=await restore();
  normalizeStats();normalizeProfile();
  if(!had)await saveMeta(true);
  else{
   try{await saveMeta(false)}catch(e){console.warn("metadata refresh failed",e)}
  }
  storageReady=true;
  void loadCoverMap().then(()=>bindCovers()).catch(()=>{});
  if(state.currentId&&state.tracks.some(t=>t.id===state.currentId))renderPlayer();
  return had;
 }catch(e){
  console.error("storage boot",e);
  storageReady=false;
  return false;
 }
 })();
 try{
   const had=await storageInitPromise;
   if(had)toast("Library restored.");
   else if(storageReady)toast("Localify Mobile ready.");
   else toast("Localify is running, but saved storage is unavailable.");
 }catch(e){console.error("boot storage",e)}
}
boot();
})();
</script>
